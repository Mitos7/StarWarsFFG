<div class="swffg-destiny-container">
    <div class="swffg-destiny {{#if isGM}}swffg-groupmanager{{/if}}" title="{{localize 'SWFFG.DestinyTrackerHint'}}">
      {{#if isGM}}
      <section class="group-manager">
        <button type="button" id="destinyMenu" class="dropbtn" data-action="toggle-destiny-menu"><i class="fas fa-bars"></i></button>
        <div class="dropdown-content">
          {{#each menu as |item|}}
          <a href="#" data-action="destiny-menu-item" data-index="{{item.index}}" title="{{item.name}}">{{{item.icon}}}</a>
          {{/each}}
        </div>
      </section>
      {{/if}}
      <section id="destinyLight" class="destiny-points {{#if isGM}}display-menu{{/if}} theme-{{ this.theme }}" data-action="change-destiny" data-value="{{destinyPool.light}}" data-group="dPoolLight">{{destinyPool.light}}<span>{{localize destinyPoolLabel.light }}</span></section>
      <section id="destinyDark" class="destiny-points theme-{{ this.theme }}" data-action="change-destiny" data-value="{{destinyPool.dark}}" data-group="dPoolDark">{{destinyPool.dark}}<span>{{localize destinyPoolLabel.dark }}</span></section>
    </div>
  </div>
